name: Publish CORE to PyPI (Trusted Publishing)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable tag version to publish"
        required: true
        default: "11.6.0"
        type: string
      source_ref:
        description: "Exact immutable source ref"
        required: true
        default: "v11.6.0"
        type: string
      confirmation:
        description: "Type PUBLISH-CORE-<version>-PYPI to enable the publish job (e.g., PUBLISH-CORE-12.0.0-PYPI)"
        required: true
        type: string

jobs:
  build:
    if: (inputs.version == '11.6.0' && inputs.source_ref == 'v11.6.0' && inputs.confirmation == 'PUBLISH-CORE-11.6.0-PYPI') || (inputs.version == '12.0.0' && inputs.source_ref == 'v12.0.0' && inputs.confirmation == 'PUBLISH-CORE-12.0.0-PYPI')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist_dir: ${{ steps.dist_name.outputs.dist_dir }}
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute dist directory name
        id: dist_name
        run: |
          if [ "${{ inputs.version }}" = "12.0.0" ]; then
            echo "dist_dir=dist/pypi-v12_0_0" >> $GITHUB_OUTPUT
          else
            echo "dist_dir=dist/pypi-v11_6_0" >> $GITHUB_OUTPUT
          fi

      - name: Build one wheel and sdist pair
        run: |
          python -m pip install --upgrade build twine
          mkdir -p ${{ steps.dist_name.outputs.dist_dir }}
          python -m build --outdir ${{ steps.dist_name.outputs.dist_dir }}
          python -m twine check ${{ steps.dist_name.outputs.dist_dir }}/*
          sha256sum ${{ steps.dist_name.outputs.dist_dir }}/* > ${{ steps.dist_name.outputs.dist_dir }}/SHA256SUMS

      - name: Upload the immutable distributions
        uses: actions/upload-artifact@v4
        with:
          name: core-runtime-engine-${{ inputs.version }}-distributions
          path: ${{ steps.dist_name.outputs.dist_dir }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: (inputs.version == '11.6.0' && inputs.source_ref == 'v11.6.0' && inputs.confirmation == 'PUBLISH-CORE-11.6.0-PYPI') || (inputs.version == '12.0.0' && inputs.source_ref == 'v12.0.0' && inputs.confirmation == 'PUBLISH-CORE-12.0.0-PYPI')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact built distributions
        uses: actions/download-artifact@v4
        with:
          name: core-runtime-engine-${{ inputs.version }}-distributions
          path: ${{ needs.build.outputs.dist_dir }}

      - name: Verify the downloaded artifact hashes
        run: |
          sha256sum --check ${{ needs.build.outputs.dist_dir }}/SHA256SUMS
          mkdir -p publish
          cp ${{ needs.build.outputs.dist_dir }}/*.whl publish/
          cp ${{ needs.build.outputs.dist_dir }}/*.tar.gz publish/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish
          repository-url: https://upload.pypi.org/legacy/
          attestations: true