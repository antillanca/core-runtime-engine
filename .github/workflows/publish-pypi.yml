name: Publish CORE to PyPI (Trusted Publishing)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable tag version to publish"
        required: true
        default: "11.6.0"
        type: string
      source_ref:
        description: "Exact immutable source ref"
        required: true
        default: "v11.6.0"
        type: string
      confirmation:
        description: "Type PUBLISH-CORE-<version>-PYPI to enable the publish job (e.g., PUBLISH-CORE-12.0.0-PYPI)"
        required: true
        type: string

jobs:
  build:
    if: (inputs.version == '11.6.0' && inputs.source_ref == 'v11.6.0' && inputs.confirmation == 'PUBLISH-CORE-11.6.0-PYPI') || (inputs.version == '12.0.0' && inputs.source_ref == 'v12.0.0' && inputs.confirmation == 'PUBLISH-CORE-12.0.0-PYPI')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build one wheel and sdist pair
        run: |
          python -m pip install --upgrade build twine
          mkdir -p dist/pypi-${{ inputs.version | replace('.', '_') }}
          python -m build --outdir dist/pypi-${{ inputs.version | replace('.', '_') }}
          python -m twine check dist/pypi-${{ inputs.version | replace('.', '_') }}/*
          sha256sum dist/pypi-${{ inputs.version | replace('.', '_') }}/* > dist/pypi-${{ inputs.version | replace('.', '_') }}/SHA256SUMS

      - name: Upload the immutable distributions
        uses: actions/upload-artifact@v4
        with:
          name: core-runtime-engine-${{ inputs.version }}-distributions
          path: dist/pypi-${{ inputs.version | replace('.', '_') }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: (inputs.version == '11.6.0' && inputs.source_ref == 'v11.6.0' && inputs.confirmation == 'PUBLISH-CORE-11.6.0-PYPI') || (inputs.version == '12.0.0' && inputs.source_ref == 'v12.0.0' && inputs.confirmation == 'PUBLISH-CORE-12.0.0-PYPI')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact built distributions
        uses: actions/download-artifact@v4
        with:
          name: core-runtime-engine-${{ inputs.version }}-distributions
          path: dist/pypi-${{ inputs.version | replace('.', '_') }}

      - name: Verify the downloaded artifact hashes
        run: |
          sha256sum --check dist/pypi-${{ inputs.version | replace('.', '_') }}/SHA256SUMS
          mkdir -p publish
          cp dist/pypi-${{ inputs.version | replace('.', '_') }}/*.whl publish/
          cp dist/pypi-${{ inputs.version | replace('.', '_') }}/*.tar.gz publish/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish
          repository-url: https://upload.pypi.org/legacy/
          attestations: true