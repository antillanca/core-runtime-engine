name: replay-certification

on:
  push:
    branches: [master]
  pull_request:

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[anchoring,dev]" -r requirements.lock
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
      - name: CORE tooling lint
        shell: bash
        run: |
          mkdir -p artifacts/tooling
          python -m core_runtime.cli lint --scope tooling --format json --output artifacts/tooling/CORE-tooling-lint-ci.json
          python -m core_runtime.cli lint --scope tooling --format markdown --output artifacts/tooling/CORE-tooling-lint-ci.md
      - name: Upload CORE tooling lint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-tooling-lint-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/tooling/CORE-tooling-lint-ci.*
      - name: Ruff
        shell: bash
        run: |
          ruff check .
      - name: Validate FrozenReleaseManifest v11.6.0
        shell: bash
        run: |
          python scripts/validate_frozen_release_manifest_v11_6.py examples/frozen_release_manifest/accepted_v11_6_0_candidate.json --verify-live-artifacts
          pytest -q \
            tests/test_frozen_release_manifest_v11_5_1.py \
            tests/test_frozen_release_manifest_v11_6.py
      - name: Frozen rule and non-custodial anchor tests
        shell: bash
        run: |
          pytest -q \
            tests/test_frozen_rule_set_validator.py \
            tests/test_rule_approval_validator.py \
            tests/test_rule_anchor_batch.py \
            tests/test_rule_anchor_deployment.py \
            tests/test_rule_anchor_transaction.py \
            tests/test_core_rule_anchor_contract.py \
            tests/test_executable_contracts.py \
            tests/test_physical_safety_assurance.py
          python scripts/audit_contract_executability.py
          python scripts/build_merkle_batch.py examples/merkle_batch/accepted_batch_request.json
          python scripts/verify_merkle_proof.py examples/merkle_batch/accepted_batch_manifest.json
      - name: Compile CoreRuleAnchor with pinned solc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/compile_core_rule_anchor.py --output-dir artifacts/solidity
      - name: Upload CoreRuleAnchor compiler artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: core-rule-anchor-solc-${{ matrix.python-version }}
          path: artifacts/solidity/*
      - name: Mypy report-only
        continue-on-error: true
        shell: bash
        run: |
          mypy --follow-imports=skip core_runtime/core/sensor_evidence.py core_runtime/core/explainability.py
      - name: Full pytest
        shell: bash
        run: |
          pytest -q
      - name: CORE v11.6.0 release gate
        shell: bash
        run: |
          mkdir -p artifacts/release
          python scripts/verify_release.py --target v11.6.0 --skip-full-pytest --output artifacts/release/core-v11.6.0-release-gate.json
      - name: Upload CORE v11.6.0 release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-v11.6.0-release-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/release/core-v11.6.0-release-gate.json
          if-no-files-found: ignore
