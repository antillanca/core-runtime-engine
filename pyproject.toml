[project]
name = "core-runtime-engine"
version = "11.6.0"
description = "CORE - deterministic contract, schema and validation engine"
readme = "docs/CORE_RELEASE_README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "CORE Project"},
]

dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
anchoring = [
    "web3>=6.0",
]
dev = [
    "pytest>=7.0",
    "packaging>=23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["core_runtime*"]

[project.scripts]
core-runtime = "core_runtime.cli.__main__:main"

[tool.setuptools.package-data]
core_runtime = [
    "data/package_data_manifest.v1.json",
    "data/schemas/core/*.json",
    "data/contracts/Core*",
]
